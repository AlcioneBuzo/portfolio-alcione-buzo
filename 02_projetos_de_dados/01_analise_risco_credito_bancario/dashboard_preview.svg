<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B132B; }
      .card { fill: #1C2541; rx: 8px; stroke: #334155; stroke-width: 1; }
      .title { fill: #F8FAFC; font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 20px; }
      .subtitle { fill: #94A3B8; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .tag { fill: #48CAE4; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; }
      .kpi-label { fill: #94A3B8; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .kpi-val { fill: #F8FAFC; font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 700; }
      .kpi-sub-pos { fill: #10B981; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
      .kpi-sub-neg { fill: #EF4444; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
      .chart-title { fill: #F8FAFC; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .bar-label { fill: #94A3B8; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
      .bar-val { fill: #F8FAFC; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; }
      .insight-head { fill: #48CAE4; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
      .insight-body { fill: #94A3B8; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="580" class="bg" />

  <!-- Header -->
  <text x="24" y="38" class="title">🏦 Performance de Crédito &amp; Gestão de Risco Bancário</text>
  <text x="24" y="58" class="subtitle">Painel Executivo Interativo • Autora: Alcione Buzo</text>
  <rect x="800" y="22" width="176" height="28" rx="14" fill="rgba(72,202,228,0.15)" stroke="rgba(72,202,228,0.4)" />
  <text x="822" y="41" class="tag">Simulação Banco Varejo</text>

  <!-- Slicers Bar -->
  <rect x="24" y="75" width="952" height="42" class="card" />
  <text x="40" y="101" fill="#48CAE4" font-family="system-ui" font-size="12" font-weight="700">🎛️ FILTROS (SLICERS):</text>
  <rect x="200" y="85" width="180" height="22" rx="4" fill="#0B132B" stroke="#334155" />
  <text x="210" y="100" fill="#F8FAFC" font-family="system-ui" font-size="11">Modalidade: Todas</text>
  <rect x="400" y="85" width="180" height="22" rx="4" fill="#0B132B" stroke="#334155" />
  <text x="410" y="100" fill="#F8FAFC" font-family="system-ui" font-size="11">Região: Todas as Regiões</text>
  <rect x="600" y="85" width="180" height="22" rx="4" fill="#0B132B" stroke="#334155" />
  <text x="610" y="100" fill="#F8FAFC" font-family="system-ui" font-size="11">Safra: 2024 - 2025</text>

  <!-- KPI Grid -->
  <!-- KPI 1 -->
  <rect x="24" y="130" width="226" height="85" class="card" />
  <text x="40" y="152" class="kpi-label">Volume Total Concedido</text>
  <text x="40" y="180" class="kpi-val">R$ 142.850.000</text>
  <text x="40" y="200" class="kpi-sub-pos">▲ +12.4% vs Safra Anterior</text>

  <!-- KPI 2 -->
  <rect x="266" y="130" width="226" height="85" class="card" />
  <text x="282" y="152" class="kpi-label">Taxa NPL Inadimplência (&gt;90d)</text>
  <text x="282" y="180" class="kpi-val" fill="#EF4444">4.15%</text>
  <text x="282" y="200" class="kpi-sub-neg">R$ 5.928.275 em risco crítico</text>

  <!-- KPI 3 -->
  <rect x="508" y="130" width="226" height="85" class="card" />
  <text x="524" y="152" class="kpi-label">Comprometimento Renda</text>
  <text x="524" y="180" class="kpi-val">28.4%</text>
  <text x="524" y="200" class="kpi-sub-pos">Limite prudencial BACEN: 30%</text>

  <!-- KPI 4 -->
  <rect x="750" y="130" width="226" height="85" class="card" />
  <text x="766" y="152" class="kpi-label">Score Médio da Carteira</text>
  <text x="766" y="180" class="kpi-val">678 pts</text>
  <text x="766" y="200" class="kpi-sub-pos">Faixa: Moderado / Bom</text>

  <!-- Charts Row -->
  <!-- Chart 1: Modalidades -->
  <rect x="24" y="230" width="468" height="210" class="card" />
  <text x="40" y="256" class="chart-title">Composição da Carteira por Modalidade (%)</text>
  
  <text x="40" y="285" class="bar-label">Financiamento Imobiliário</text>
  <text x="440" y="285" class="bar-val" text-anchor="end">42%</text>
  <rect x="40" y="292" width="410" height="10" rx="5" fill="#0B132B" />
  <rect x="40" y="292" width="172" height="10" rx="5" fill="#48CAE4" />

  <text x="40" y="320" class="bar-label">Financiamento Veicular</text>
  <text x="440" y="320" class="bar-val" text-anchor="end">24%</text>
  <rect x="40" y="327" width="410" height="10" rx="5" fill="#0B132B" />
  <rect x="40" y="327" width="98" height="10" rx="5" fill="#10B981" />

  <text x="40" y="355" class="bar-label">Empréstimo Empresarial PJ</text>
  <text x="440" y="355" class="bar-val" text-anchor="end">18%</text>
  <rect x="40" y="362" width="410" height="10" rx="5" fill="#0B132B" />
  <rect x="40" y="362" width="73" height="10" rx="5" fill="#8B5CF6" />

  <text x="40" y="390" class="bar-label">Crédito Pessoal &amp; Cartão Rotativo</text>
  <text x="440" y="390" class="bar-val" text-anchor="end">16%</text>
  <rect x="40" y="397" width="410" height="10" rx="5" fill="#0B132B" />
  <rect x="40" y="397" width="65" height="10" rx="5" fill="#EF4444" />

  <!-- Chart 2: Score NPL -->
  <rect x="508" y="230" width="468" height="210" class="card" />
  <text x="524" y="256" class="chart-title">Taxa NPL Inadimplência (%) por Faixa de Score</text>

  <text x="524" y="285" class="bar-label">Excelente (Score 750+)</text>
  <text x="924" y="285" class="bar-val" text-anchor="end">0.4% NPL</text>
  <rect x="524" y="292" width="410" height="10" rx="5" fill="#0B132B" />
  <rect x="524" y="292" width="20" height="10" rx="5" fill="#10B981" />

  <text x="524" y="320" class="bar-label">Bom (Score 650-749)</text>
  <text x="924" y="320" class="bar-val" text-anchor="end">1.8% NPL</text>
  <rect x="524" y="327" width="410" height="10" rx="5" fill="#0B132B" />
  <rect x="524" y="327" width="65" height="10" rx="5" fill="#48CAE4" />

  <text x="524" y="355" class="bar-label">Médio (Score 550-649)</text>
  <text x="924" y="355" class="bar-val" text-anchor="end">5.2% NPL</text>
  <rect x="524" y="362" width="410" height="10" rx="5" fill="#0B132B" />
  <rect x="524" y="362" width="180" height="10" rx="5" fill="#F59E0B" />

  <text x="524" y="390" class="bar-label">Alto Risco (Score &lt;550)</text>
  <text x="924" y="390" class="bar-val" text-anchor="end">14.6% NPL</text>
  <rect x="524" y="397" width="410" height="10" rx="5" fill="#0B132B" />
  <rect x="524" y="397" width="380" height="10" rx="5" fill="#EF4444" />

  <!-- Insights Card -->
  <rect x="24" y="455" width="952" height="105" class="card" />
  <text x="40" y="480" class="insight-head">💡 Diagnóstico do Analista de Dados (Alcione Buzo)</text>
  <text x="40" y="502" class="insight-body">1. Inadimplência Crítica em Cartão Rotativo (8.7% NPL) — Recomendada redução do limite pré-aprovado para score &lt; 620.</text>
  <text x="40" y="522" class="insight-body">2. Trava de Comprometimento de Renda — Contratos com comprometimento &gt; 35% concentram 62% da inadimplência total.</text>
  <text x="40" y="542" class="insight-body">3. Alta Eficiência do Canal App Mobile — Registrou a menor taxa de atraso (2.1%) e o maior ticket médio.</text>
</svg>
